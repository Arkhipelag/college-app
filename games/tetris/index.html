<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stack Tower - Башня</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(145deg, #1a1e2c, #0f1219);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            touch-action: pan-y;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 420px;
            height: auto;
            border-radius: 28px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.06) inset;
            background: #0b0e14;
            cursor: pointer;
            transition: transform 0.1s;
        }
        canvas:active {
            transform: scale(0.99);
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 420px;
            margin-top: 14px;
            padding: 0 6px;
            color: #d0d9e6;
            font-weight: 500;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
            letter-spacing: 0.3px;
        }
        .score-box {
            background: rgba(20, 28, 40, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 18px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        .score-box span {
            color: #fff;
            font-weight: 700;
            font-size: 1.5rem;
            min-width: 3rem;
            text-align: center;
            background: linear-gradient(135deg, #ffffff, #b3c9e7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn {
            background: rgba(30, 42, 60, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 22px;
            border-radius: 60px;
            color: #eef3fc;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 16px -4px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn:hover {
            background: rgba(45, 62, 88, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 4px 8px -2px rgba(0,0,0,0.6);
        }
        .controls {
            display: flex;
            gap: 12px;
        }
        .perfect-popup {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 2.2rem;
            font-weight: 800;
            text-shadow: 0 0 30px #ffd966, 0 0 15px #ffb347;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffe6a7, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
            z-index: 100;
        }
        .perfect-popup.show {
            opacity: 1;
            animation: popAndFade 0.8s ease-out forwards;
        }
        @keyframes popAndFade {
            0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -90%) scale(0.9); }
        }
        .game-over-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 28px 38px;
            border-radius: 48px;
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 30px 50px -10px black;
            display: none;
            flex-direction: column;
            gap: 16px;
            z-index: 200;
            pointer-events: none;
        }
        .game-over-msg small {
            font-size: 1rem;
            font-weight: 400;
            color: #aab9d0;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="hud">
        <div class="score-box">
            🏆 <span id="scoreDisplay">0</span>
        </div>
        <div class="controls">
            <button class="btn" id="restartBtn">🔄 Заново</button>
        </div>
    </div>
    <div class="perfect-popup" id="perfectPopup">✨ PERFECT ✨</div>
    <div class="game-over-msg" id="gameOverMsg">
        💀 Игра окончена
        <small>Нажмите "Заново"</small>
    </div>
</div>
<script>
    (function() {
        // ---------- КОНФИГУРАЦИЯ ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const perfectPopup = document.getElementById('perfectPopup');
        const gameOverMsg = document.getElementById('gameOverMsg');
        const restartBtn = document.getElementById('restartBtn');

        // Размеры (логические)
        const CW = 400;
        const CH = 600;
        canvas.width = CW;
        canvas.height = CH;

        // Параметры игры
        const BLOCK_HEIGHT = 28;           // высота блока
        const BASE_BLOCK_WIDTH = 240;      // начальная ширина
        const MIN_BLOCK_WIDTH = 20;        // минимальная ширина для продолжения
        const PERFECT_TOLERANCE = 6;        // допуск для "perfect"
        const SPEED_BASE = 2.2;            // базовая скорость движения
        const SPEED_MAX = 6.5;             // максимальная скорость
        const SPEED_INCREASE = 0.12;        // увеличение скорости за блок

        // Цвета
        const COLORS = [
            '#FF6B6B', '#4ECDC4', '#FFD166', '#6C5CE7', '#FF9F1C',
            '#2EC4B6', '#E76F51', '#9B5DE5', '#F15BB5', '#00BBF9',
            '#FEE440', '#00F5D4', '#FB5607', '#8338EC', '#3A86FF'
        ];

        // ---------- СОСТОЯНИЕ ИГРЫ ----------
        let blocks = [];                 // { x, y, width, color, baseY }
        let currentBlock = null;         // движущийся блок
        let score = 0;
        let gameActive = false;
        let gameOver = false;
        let direction = 1;               // 1 = вправо, -1 = влево
        let speed = SPEED_BASE;
        let animationFrame = null;
        let lastTimestamp = 0;
        let perfectTimer = null;

        // Смещение камеры (визуальное)
        let cameraOffsetY = 0;
        let targetCameraOffsetY = 0;

        // Для плавности
        let accumulatedTime = 0;
        const MOVE_STEP = 16;            // мс на шаг (для фиксированной скорости при разных FPS)

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
        function randomColor() {
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        // Получить Y верхней части блока (для отрисовки)
        function getBlockScreenY(block, cameraY) {
            // block.y - это мировая координата (0 = низ башни)
            // Экранная координата: CH - (block.y + BLOCK_HEIGHT) + cameraY
            // Но проще: храним baseY как "уровень" (0 = нижний блок)
            // И используем cameraOffset для сдвига всей сцены вниз, когда башня растет
            return CH - (block.baseY * BLOCK_HEIGHT) - BLOCK_HEIGHT + cameraY;
        }

        // Пересчитать позиции всех блоков с учетом камеры
        function updateCamera() {
            // Камера показывает верхнюю часть башни
            const topBlock = blocks[blocks.length - 1];
            if (topBlock) {
                const topWorldY = topBlock.baseY * BLOCK_HEIGHT;
                // Хотим, чтобы верхний блок был на высоте примерно 1/3 экрана от верха
                const desiredScreenY = CH * 0.3;
                // Экранная Y верхнего блока = CH - topWorldY - BLOCK_HEIGHT + cameraOffsetY
                // Решаем: CH - topWorldY - BLOCK_HEIGHT + cameraOffsetY = desiredScreenY
                targetCameraOffsetY = desiredScreenY - CH + topWorldY + BLOCK_HEIGHT;
            }
            // Плавное движение камеры
            cameraOffsetY += (targetCameraOffsetY - cameraOffsetY) * 0.15;
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ / СБРОС ----------
        function initGame() {
            // Очистка
            blocks = [];
            currentBlock = null;
            score = 0;
            gameActive = true;
            gameOver = false;
            direction = 1;
            speed = SPEED_BASE;
            cameraOffsetY = 0;
            targetCameraOffsetY = 0;
            updateScoreDisplay();
            gameOverMsg.style.display = 'none';
            perfectPopup.classList.remove('show');

            // Базовый блок (неподвижный)
            const baseBlock = {
                x: (CW - BASE_BLOCK_WIDTH) / 2,
                baseY: 0,
                width: BASE_BLOCK_WIDTH,
                color: COLORS[0],
                isBase: true
            };
            blocks.push(baseBlock);

            // Создаем первый движущийся блок
            spawnMovingBlock();

            // Запускаем игровой цикл
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
            }
            lastTimestamp = performance.now();
            animationFrame = requestAnimationFrame(gameLoop);
        }

        // Создать новый движущийся блок
        function spawnMovingBlock() {
            const lastBlock = blocks[blocks.length - 1];
            const newBaseY = lastBlock.baseY + 1;
            const newWidth = lastBlock.width;
            const color = randomColor();

            // Стартовая позиция: случайная сторона (левая или правая)
            const fromLeft = Math.random() < 0.5;
            const startX = fromLeft ? 0 : CW - newWidth;
            direction = fromLeft ? 1 : -1;

            // Сброс скорости с нарастанием
            speed = Math.min(SPEED_BASE + score * SPEED_INCREASE, SPEED_MAX);

            currentBlock = {
                x: startX,
                baseY: newBaseY,
                width: newWidth,
                color: color,
                fromLeft: fromLeft
            };
        }

        // ---------- ЛОГИКА ХОДА ----------
        function placeBlock() {
            if (!gameActive || gameOver || !currentBlock) return;

            const lastBlock = blocks[blocks.length - 1];
            const currX = currentBlock.x;
            const currW = currentBlock.width;
            const lastX = lastBlock.x;
            const lastW = lastBlock.width;

            // Вычисляем пересечение
            const overlapLeft = Math.max(currX, lastX);
            const overlapRight = Math.min(currX + currW, lastX + lastW);
            const overlapWidth = Math.max(0, overlapRight - overlapLeft);

            // Проверка на perfect (с допуском)
            const perfect = Math.abs(currX - lastX) <= PERFECT_TOLERANCE && 
                            Math.abs((currX + currW) - (lastX + lastW)) <= PERFECT_TOLERANCE;

            if (overlapWidth <= 0) {
                // Полный промах — конец игры
                gameActive = false;
                gameOver = true;
                gameOverMsg.style.display = 'flex';
                // Анимация падения текущего блока
                if (currentBlock) {
                    // Добавим блок для анимации падения (но не в стек)
                    // Можно просто отрисовать его падающим в отдельном массиве,
                    // но для простоты просто уроним
                }
                return;
            }

            // Определяем новые параметры блока
            let newWidth = overlapWidth;
            let newX = overlapLeft;
            let color = currentBlock.color;

            if (perfect) {
                // Идеальное попадание: сохраняем ширину и позицию
                newWidth = lastW;
                newX = lastX;
                // Бонус: счет +1 (как за обычный блок)
                // Показываем попап
                showPerfectPopup();
                // Небольшой бонус к очкам? Нет, просто визуал
            } else {
                // Обрезаем блок
                // Если блок был слишком мал — game over
                if (newWidth < MIN_BLOCK_WIDTH) {
                    gameActive = false;
                    gameOver = true;
                    gameOverMsg.style.display = 'flex';
                    return;
                }
            }

            // Создаём новый блок в стеке
            const placedBlock = {
                x: newX,
                baseY: currentBlock.baseY,
                width: newWidth,
                color: currentBlock.color,
                isBase: false
            };
            blocks.push(placedBlock);

            // Увеличиваем счет
            score++;
            updateScoreDisplay();

            // Проверка на победу? Бесконечная игра.

            // Создаем следующий движущийся блок
            spawnMovingBlock();

            // Обновляем камеру (цель)
            updateCamera();
        }

        // Показать всплывающее "Perfect"
        function showPerfectPopup() {
            if (perfectTimer) clearTimeout(perfectTimer);
            perfectPopup.classList.add('show');
            perfectTimer = setTimeout(() => {
                perfectPopup.classList.remove('show');
            }, 700);
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = score;
        }

        // ---------- ОБНОВЛЕНИЕ ДВИЖЕНИЯ ----------
        function updateMovement(deltaTime) {
            if (!gameActive || gameOver || !currentBlock) return;

            // Движение с учетом deltaTime (нормализуем к 60 FPS)
            const dt = Math.min(deltaTime, 32) / 16.666; // коэффициент
            const step = speed * dt * direction;

            currentBlock.x += step;

            // Отражение от границ
            if (currentBlock.x <= 0) {
                currentBlock.x = 0;
                direction = 1;
            } else if (currentBlock.x + currentBlock.width >= CW) {
                currentBlock.x = CW - currentBlock.width;
                direction = -1;
            }
        }

        // ---------- ОТРИСОВКА ----------
        function draw() {
            // Очистка фона с градиентом
            const gradient = ctx.createLinearGradient(0, 0, 0, CH);
            gradient.addColorStop(0, '#0b0f18');
            gradient.addColorStop(0.6, '#141c2c');
            gradient.addColorStop(1, '#0a0e16');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CW, CH);

            // Легкие декоративные линии/звезды (для атмосферы)
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            for (let i = 0; i < 20; i++) {
                const x = (i * 37 + 13) % CW;
                const y = (i * 83 + 7) % CH;
                ctx.beginPath();
                ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Отрисовка всех блоков в стеке
            for (let i = 0; i < blocks.length; i++) {
                const block = blocks[i];
                const screenY = getBlockScreenY(block, cameraOffsetY);
                // Проверяем, виден ли блок (оптимизация)
                if (screenY > CH + BLOCK_HEIGHT || screenY < -BLOCK_HEIGHT * 2) continue;

                // Тень блока
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 4;
                ctx.shadowOffsetX = 0;

                // Основной блок с градиентом
                const blockGrad = ctx.createLinearGradient(block.x, screenY, block.x, screenY + BLOCK_HEIGHT);
                blockGrad.addColorStop(0, block.color);
                blockGrad.addColorStop(1, shadeColor(block.color, -30));
                ctx.fillStyle = blockGrad;
                ctx.beginPath();
                ctx.roundRect(block.x, screenY, block.width, BLOCK_HEIGHT, 6);
                ctx.fill();

                // Блик сверху
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.roundRect(block.x + 2, screenY + 2, block.width - 4, 4, 3);
                ctx.fill();

                // Обводка
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(block.x, screenY, block.width, BLOCK_HEIGHT, 6);
                ctx.stroke();
            }

            // Отрисовка движущегося блока
            if (currentBlock && gameActive && !gameOver) {
                const screenY = getBlockScreenY(currentBlock, cameraOffsetY);
                if (screenY > CH + BLOCK_HEIGHT || screenY < -BLOCK_HEIGHT * 2) {
                    // Если блок не виден, не рисуем
                } else {
                    // Тень
                    ctx.shadowColor = 'rgba(0,0,0,0.6)';
                    ctx.shadowBlur = 16;
                    ctx.shadowOffsetY = 6;
                    ctx.shadowOffsetX = 0;

                    const blockGrad = ctx.createLinearGradient(currentBlock.x, screenY, currentBlock.x, screenY + BLOCK_HEIGHT);
                    blockGrad.addColorStop(0, currentBlock.color);
                    blockGrad.addColorStop(1, shadeColor(currentBlock.color, -35));
                    ctx.fillStyle = blockGrad;
                    ctx.beginPath();
                    ctx.roundRect(currentBlock.x, screenY, currentBlock.width, BLOCK_HEIGHT, 6);
                    ctx.fill();

                    // Блик
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.roundRect(currentBlock.x + 2, screenY + 2, currentBlock.width - 4, 4, 3);
                    ctx.fill();

                    // Обводка с подсветкой
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.roundRect(currentBlock.x, screenY, currentBlock.width, BLOCK_HEIGHT, 6);
                    ctx.stroke();
                }
            }

            // Сброс теней
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.shadowOffsetX = 0;

            // Подсказка при старте
            if (blocks.length === 1 && gameActive && !gameOver) {
                ctx.font = '500 16px "Segoe UI", system-ui, sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.textAlign = 'center';
                ctx.fillText('Нажми, чтобы поставить блок', CW/2, CH - 70);
            }
        }

        // Вспомогательная функция для затемнения/осветления цвета
        function shadeColor(color, percent) {
            // color: #RRGGBB
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return `rgb(${R},${G},${B})`;
        }

        // Полифилл для roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        // ---------- ИГРОВОЙ ЦИКЛ ----------
        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = Math.min(32, timestamp - lastTimestamp);
            lastTimestamp = timestamp;

            if (gameActive && !gameOver) {
                updateMovement(deltaTime);
            }

            // Обновление камеры (плавно)
            updateCamera();

            draw();

            animationFrame = requestAnimationFrame(gameLoop);
        }

        // ---------- УПРАВЛЕНИЕ ----------
        function handlePlace(event) {
            if (!gameActive || gameOver) return;
            event.preventDefault();
            placeBlock();
        }

        canvas.addEventListener('click', handlePlace);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePlace(e);
        }, { passive: false });

        // Рестарт
        restartBtn.addEventListener('click', () => {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            initGame();
        });

        // Обработка клавиатуры (пробел)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                if (gameActive && !gameOver) {
                    placeBlock();
                } else if (gameOver) {
                    // Можно перезапустить по пробелу?
                }
            }
            if (e.code === 'KeyR') {
                initGame();
            }
        });

        // Запуск
        initGame();

        // Корректировка при изменении размера (адаптивность canvas через CSS)
        function resizeCanvas() {
            // Ничего не делаем, т.к. canvas имеет фиксированные логические размеры, а CSS масштабирует
        }
        window.addEventListener('resize', resizeCanvas);

        // Для отладки
        console.log('Stack Tower game loaded!');
    })();
</script>
</body>
</html>
